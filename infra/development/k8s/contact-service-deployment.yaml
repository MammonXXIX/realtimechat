apiVersion: apps/v1
kind: Deployment
metadata:
  name: contact-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: contact-service
  template:
    metadata:
      labels:
        app: contact-service
    spec:
      containers:
        - name: contact-service
          image: realtimechat/contact-service
          ports:
            - containerPort: 8083
          resources:
            limits:
              memory: "128Mi"
              cpu: "125m"
            requests:
              memory: "128Mi"
              cpu: "125m"
          env:
            - name: DATABASE_URL
              value: postgresql://neondb_owner:npg_JHT3cu5AGdCP@ep-wild-flower-a1nvwm29-pooler.ap-southeast-1.aws.neon.tech/contact-service?sslmode=require&channel_binding=require
---
apiVersion: v1
kind: Service
metadata:
  name: contact-service
spec:
  type: LoadBalancer
  ports:
    - port: 8083
      targetPort: 8083
  selector:
    app: contact-service
